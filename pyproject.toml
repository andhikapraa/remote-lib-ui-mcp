[project]
name = "remote-lib-ui-mcp"
version = "0.2.0"
description = "MCP server for UI's remote library (remote-lib.ui.ac.id) — CAS SSO login, EZproxy access, content fetch, and database search (native scrapers + OpenAlex metadata fallback), with a cloakbrowser stealth fallback for Cloudflare-walled resources."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Andhika" }]
keywords = ["mcp", "ezproxy", "library", "ui", "cas", "scraping", "openalex"]

dependencies = [
    "mcp>=1.27,<2",
    "httpx[http2]>=0.28,<1.0",
    "beautifulsoup4>=4.12,<5.0",
    "lxml>=5.0",
    "markdownify>=0.13",
    "pydantic>=2.13",
    "pydantic-settings>=2.14",
    "aiolimiter>=1.1",
    "cachetools>=5.3",
]

[project.optional-dependencies]
# Stealth-browser fallback for Cloudflare-protected / JS-rendered databases
# (Scopus, IEEE search, etc.). Installs a patched Chromium on first run.
browser = ["cloakbrowser>=0.3,<1.0"]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "respx>=0.21",
    "ruff>=0.8",
    "pyright>=1.1.390",
    "coverage>=7.6",
]

[project.scripts]
remote-lib-ui-mcp = "remote_lib_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/remote_lib_mcp"]
artifacts = ["*.pem", "py.typed"]

[tool.uv]
package = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-q"

[tool.coverage.run]
branch = true
source = ["remote_lib_mcp"]

[tool.coverage.report]
show_missing = true
exclude_also = ["@overload", "raise NotImplementedError", "if TYPE_CHECKING:"]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "C4", "UP", "B", "SIM", "RUF", "T20", "LOG"]
ignore = ["E501", "SIM105", "SIM102"]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]
"tests/**" = ["T20"]

[tool.pyright]
include = ["src"]
typeCheckingMode = "basic"
venvPath = "."
venv = ".venv"
reportMissingImports = false
# BeautifulSoup's element.get()/.attrs are typed as str|list unions, producing
# pervasive false positives in the scraping code; disable just those two rules.
reportArgumentType = "none"
reportAttributeAccessIssue = "none"
