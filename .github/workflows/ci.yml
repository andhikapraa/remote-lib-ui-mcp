name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Sync (core + dev, no browser extra)
        run: uv sync --dev --python ${{ matrix.python-version }}

      - name: Lint
        run: uv run ruff check src/remote_lib_mcp tests

      - name: Format check
        run: uv run ruff format --check src/remote_lib_mcp tests

      - name: Type check
        run: uv run pyright src/remote_lib_mcp

      - name: Tests
        run: uv run coverage run -m pytest && uv run coverage report
